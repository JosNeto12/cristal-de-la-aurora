<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#05060d">
<title>Cristal de la Aurora — Un RPG de la era SNES</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="stage">
    <div id="frame">
      <canvas id="game" width="320" height="240" aria-label="Juego"></canvas>
      <div id="crt" aria-hidden="true"></div>
    </div>
    <p id="hint">
      <span><b>Flechas / WASD</b> mover</span>
      <span><b>Z / Enter</b> confirmar</span>
      <span><b>X / Esc</b> menú / volver</span>
      <span><b>F</b> pantalla completa</span>
    </p>
  </main>
  <div id="fatal" hidden>
    <h1>Algo se rompió en el reino</h1>
    <pre id="fatal-msg"></pre>
  </div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
