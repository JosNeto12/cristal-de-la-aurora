name: Pruebas

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Motor de audio
        run: node tests/audio.mjs
      - name: Validación de datos
        run: node tests/validate.mjs
      - name: Simulación de combate
        run: node tests/battle-sim.mjs
      - name: Menús de batalla
        run: node tests/battle-flow.mjs
      - name: Recorrido completo
        run: node tests/playthrough.mjs
